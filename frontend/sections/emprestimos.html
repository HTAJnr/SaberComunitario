<section id="section-emprestimos" class="section p-6 hidden">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold">Empréstimos</h2>
    <button onclick="abrirModalEmprestimo()" class="btn-primary">
      <i class="fa-solid fa-plus mr-1"></i> Registar Empréstimo
    </button>
  </div>
  <div class="flex gap-2 mb-4">
    <button id="tab-emp-ativos" onclick="switchTabEmprestimos('ACTIVO')" class="tab-btn tab-active">
      <i class="fa-solid fa-clock-rotate-left mr-1"></i> Activos
    </button>
    <button id="tab-emp-hist" onclick="switchTabEmprestimos('HISTORICO')" class="tab-btn">
      <i class="fa-solid fa-rectangle-list mr-1"></i> Histórico
    </button>
  </div>
  <div class="card overflow-x-auto">
    <table class="w-full text-sm">
      <thead><tr class="border-b border-slate-700 text-slate-400">
        <th class="text-left py-2 px-3">ID</th>
        <th class="text-left py-2 px-3">Leitor</th>
        <th class="text-left py-2 px-3">Material</th>
        <th class="text-left py-2 px-3">Data Emp.</th>
        <th class="text-left py-2 px-3">Devolução Prev.</th>
        <th class="text-left py-2 px-3">Multa</th>
        <th class="text-left py-2 px-3">Estado</th>
        <th class="text-left py-2 px-3">Acções</th>
      </tr></thead>
      <tbody id="tabela-emprestimos"></tbody>
    </table>
  </div>
</section>
