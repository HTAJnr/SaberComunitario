<section id="section-dashboard" class="section hidden">

  <!-- ── Vista Biblioteca (Coord / Biblio / Assistente) ── -->
  <div id="dash-bib-view">

    <!-- Stat cards -->
    <div id="dash-stats" class="stats-grid"></div>

    <!-- Linha 1: Devoluções hoje + Gráfico de empréstimos -->
    <div class="panel-grid" style="margin-bottom:16px">

      <div class="panel">
        <div class="panel-title">Devoluções previstas hoje</div>
        <div id="dash-devolucoes-hoje"></div>
      </div>

      <div class="panel" id="dash-grafico-panel">
        <div class="panel-title">Empréstimos — últimos 7 dias</div>
        <div id="dash-bar-chart" class="bar-chart" style="height:90px;margin-top:8px"></div>
      </div>

    </div>

    <!-- Linha 2: Leitores recentes + Transferências (só Coord/Biblio) -->
    <div class="panel-grid" id="dash-linha2">

      <div class="panel">
        <div class="panel-title">Leitores recentes</div>
        <table class="tbl">
          <thead>
            <tr>
              <th>Cartão</th>
              <th>Nome</th>
              <th>Tipo</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="dash-leitores-tbody"></tbody>
        </table>
      </div>

      <div class="panel">
        <div class="panel-title">Transferências recentes</div>
        <div id="dash-transferencias"></div>
      </div>

    </div>

    <!-- Linha 3: Empréstimos em atraso + Próximos eventos -->
    <div class="panel-grid" id="dash-linha3">
      <div class="panel">
        <div class="panel-title">Empréstimos em atraso</div>
        <div id="dash-atrasos"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Próximos eventos</div>
        <div id="dash-proximos-eventos"></div>
      </div>
    </div>

  </div>

  <!-- ── Vista Rede (só Administrador) ── -->
  <div id="dash-rede-view" class="hidden">

    <!-- Tabs: Rede | Biblioteca | Sistema -->
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button id="tab-dash-rede"    class="tab-btn tab-active" onclick="switchDashTab('rede')">
        <i class="fa-solid fa-network-wired" style="margin-right:4px"></i>Rede
      </button>
      <button id="tab-dash-biblioteca" class="tab-btn" onclick="switchDashTab('biblioteca')">
        <i class="fa-solid fa-building-columns" style="margin-right:4px"></i>Biblioteca
      </button>
      <button id="tab-dash-sistema" class="tab-btn" onclick="switchDashTab('sistema')">
        <i class="fa-solid fa-database" style="margin-right:4px"></i>Sistema
      </button>
    </div>

    <!-- Tab Biblioteca (Admin vê a sua própria biblioteca) -->
    <div id="dash-tab-biblioteca" class="hidden"></div>

    <!-- Tab Rede -->
    <div id="dash-tab-rede">
      <div id="dash-rede-stats" class="stats-grid"></div>

      <div class="panel" style="margin-top:4px">
        <div class="panel-title">Bibliotecas da rede</div>
        <div id="dash-rede-table"></div>
      </div>

      <div class="panel-grid" style="margin-top:16px">
        <div class="panel">
          <div class="panel-title">Empréstimos em atraso — rede</div>
          <div id="dash-atrasos-rede"></div>
        </div>
        <div class="panel">
          <div class="panel-title">Próximos eventos</div>
          <div id="dash-proximos-eventos-rede"></div>
        </div>
      </div>
    </div>

    <!-- Tab Sistema (snapshots / réplicas) -->
    <div id="dash-tab-sistema" class="hidden">
      <div class="panel">
        <div class="panel-title" style="display:flex;align-items:center;justify-content:space-between">
          <span>Snapshots / Réplicas — nó actual</span>
          <button id="btn-refresh-snapshots" class="btn btn-sm" onclick="refreshSnapshots()">
            Actualizar Snapshots
          </button>
        </div>
        <div id="dash-snapshots-lista" style="margin-top:8px">
          <p style="color:var(--text-secondary);font-size:12px">A carregar...</p>
        </div>
      </div>
    </div>

  </div>

</section>
