<div id="login-screen">
  <div class="login-card">
    <img src="/resources/imgs/Logo.png" alt="Saber Comunitário" class="login-logo"/>
    <div class="login-titulo">Saber Comunitário</div>
    <div class="login-subtitulo">Fundo Bibliográfico de Moçambique</div>

    <div id="login-erro" class="login-erro hidden">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="login-erro-msg"></span>
    </div>

    <form id="login-form">
      <div class="login-field">
        <label class="login-label" for="login-email">Email</label>
        <input id="login-email" class="login-input" type="email" placeholder="email@sabercomunitario.mz" autocomplete="email" required/>
      </div>
      <div class="login-field">
        <label class="login-label" for="login-senha">Senha</label>
        <input id="login-senha" class="login-input" type="password" placeholder="••••••••" autocomplete="current-password" required/>
      </div>
      <button type="submit" class="login-btn" id="login-btn">Entrar</button>
    </form>
  </div>
</div>
