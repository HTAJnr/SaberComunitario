<!-- ════════════ MODAL GENÉRICO ════════════ -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="fecharModal(event)">
  <div id="modal-box" class="modal">
    <div class="modal-header">
      <span id="modal-titulo" class="modal-title"></span>
      <button onclick="fecharModal()" class="modal-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div id="modal-conteudo"></div>
    <div id="modal-erro" class="modal-erro hidden">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="modal-erro-msg"></span>
    </div>
    <div class="modal-footer">
      <button onclick="fecharModal()" class="btn-ghost">
        <i class="fa-solid fa-xmark" style="margin-right:4px"></i>Cancelar
      </button>
      <button id="modal-btn-salvar" class="btn-primary">
        <i class="fa-solid fa-floppy-disk" style="margin-right:4px"></i>Guardar
      </button>
    </div>
  </div>
</div>

<!-- ════════════ MODAL PARTICIPAÇÕES ════════════ -->
<div id="modal-participacoes" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">
        <i class="fa-solid fa-users" style="margin-right:8px;color:var(--theme-accent)"></i>Gerir Participações
      </span>
      <button onclick="fecharModalParticipacoes()" class="modal-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <input id="input-nc-inscricao" type="text" placeholder="Nº Cartão do leitor" class="input-field" style="flex:1"/>
      <button onclick="inscreverLeitorEvento()" class="btn-primary">
        <i class="fa-solid fa-user-plus" style="margin-right:4px"></i>Inscrever
      </button>
    </div>
    <div id="lista-participacoes" style="font-size:12px"></div>
  </div>
</div>

<!-- ════════════ MODAL DEVOLUÇÃO ════════════ -->
<div id="modal-devolucao" class="modal-overlay hidden">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <span class="modal-title">
        <i class="fa-solid fa-rotate-left" style="margin-right:8px;color:var(--theme-accent)"></i>Registar Devolução
      </span>
      <button onclick="fecharModalDevolucao()" class="modal-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <p id="dev-info" style="font-size:12px;color:var(--text-secondary);margin-bottom:16px"></p>
    <div class="form-group">
      <label class="form-label">Condição na devolução</label>
      <select id="dev-condicao" class="input-field">
        <option value="Bom">Bom estado</option>
        <option value="Degradado">Degradado</option>
        <option value="Destruido">Destruído</option>
        <option value="Perdido">Perdido</option>
      </select>
    </div>
    <div id="dev-multa-info" class="alert-warn hidden">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span id="dev-multa-msg"></span>
    </div>
    <div class="modal-footer">
      <button onclick="fecharModalDevolucao()" class="btn-ghost">
        <i class="fa-solid fa-xmark" style="margin-right:4px"></i>Cancelar
      </button>
      <button onclick="confirmarDevolucao()" class="btn-primary">
        <i class="fa-solid fa-rotate-left" style="margin-right:4px"></i>Confirmar Devolução
      </button>
    </div>
  </div>
</div>

<!-- ════════════ MODAL PERFIL ════════════ -->
<div id="modal-perfil-overlay" class="modal-overlay hidden" onclick="fecharModalPerfil(event)">
  <div class="modal" style="width:440px">
    <div class="modal-header">
      <span class="modal-title">
        <i class="fa-solid fa-circle-user" style="margin-right:8px;color:var(--theme-accent)"></i>Meu Perfil
      </span>
      <button onclick="fecharModalPerfil()" class="modal-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:14px">
      <button id="ptab-info" class="tab-btn tab-active" style="font-size:12px;padding:4px 12px"
              onclick="_mudarTabPerfil('info')">
        <i class="fa-solid fa-user" style="margin-right:4px"></i>Perfil
      </button>
      <button id="ptab-senha" class="tab-btn" style="font-size:12px;padding:4px 12px"
              onclick="_mudarTabPerfil('senha')">
        <i class="fa-solid fa-lock" style="margin-right:4px"></i>Senha
      </button>
    </div>
    <div id="modal-perfil-erro" class="modal-erro hidden">
      <i class="fa-solid fa-circle-exclamation" style="margin-right:6px"></i>
      <span id="modal-perfil-erro-msg"></span>
    </div>
    <div id="modal-perfil-conteudo" style="padding:2px 0"></div>
    <div id="modal-perfil-footer" class="modal-footer">
      <button onclick="fecharModalPerfil()" class="btn-ghost">
        <i class="fa-solid fa-xmark" style="margin-right:4px"></i>Cancelar
      </button>
      <button onclick="_submeterPerfil()" class="btn-primary">
        <i class="fa-solid fa-floppy-disk" style="margin-right:4px"></i>Guardar
      </button>
    </div>
  </div>
</div>

<!-- ════════════ MODAL CONFIRMAÇÃO ════════════ -->
<div id="modal-confirm" class="modal-confirm hidden">
  <div class="modal-confirm-box">
    <p id="modal-confirm-msg" class="modal-confirm-msg"></p>
    <div class="modal-confirm-actions">
      <button id="modal-confirm-cancelar" class="btn-ghost">Cancelar</button>
      <button id="modal-confirm-ok" class="btn-danger">Confirmar</button>
    </div>
  </div>
</div>

<!-- ════════════ MODAL REEMISSÃO ════════════ -->
<div id="modal-reemissao" class="modal-overlay hidden">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <span class="modal-title">Reemitir Certificado</span>
      <button id="modal-reemissao-fechar" class="modal-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="form-group">
      <label class="form-label">Motivo da reemissão *</label>
      <input id="modal-reemissao-motivo" type="text" placeholder="Ex: Certificado perdido" class="input-field"/>
    </div>
    <div class="modal-footer">
      <button id="modal-reemissao-cancelar" class="btn-ghost">Cancelar</button>
      <button id="modal-reemissao-ok" class="btn-primary">
        <i class="fa-solid fa-rotate" style="margin-right:4px"></i>Reemitir
      </button>
    </div>
  </div>
</div>

<!-- ════════════ MODAL PERMISSÕES 09-D ════════════ -->
<div id="modal-perm-overlay" class="modal-overlay hidden" onclick="fecharModalPerm(event)">
  <div class="modal" style="width:660px;max-height:90vh;display:flex;flex-direction:column">
    <div class="modal-header">
      <span class="modal-title">Gerir Permissões</span>
      <button onclick="fecharModalPerm()" class="modal-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div id="modal-perm-erro" class="modal-erro hidden">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="modal-perm-erro-msg"></span>
    </div>
    <div id="modal-perm-conteudo" style="overflow-y:auto;flex:1;padding:2px 0 4px"></div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="fecharModalPerm()">Cancelar</button>
      <button class="btn-primary" onclick="_submeterModalPerm()">
        <i class="fa-solid fa-shield-halved" style="margin-right:5px"></i>Guardar permissão
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden"></div>
