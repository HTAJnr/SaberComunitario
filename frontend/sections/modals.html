<!-- ════════════ MODAL GENÉRICO ════════════ -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div id="modal-box" class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-xl max-h-[90vh] overflow-y-auto shadow-2xl">
    <div class="flex items-center justify-between p-5 border-b border-slate-700">
      <h3 id="modal-titulo" class="font-bold text-lg"></h3>
      <button onclick="fecharModal()" class="text-slate-400 hover:text-white w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-700 transition-colors">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>
    <div id="modal-conteudo" class="p-5 space-y-3"></div>
    <div id="modal-erro" class="hidden mx-5 mb-0 bg-red-900/50 border border-red-500 text-red-300 rounded-lg p-3 text-sm flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="modal-erro-msg"></span>
    </div>
    <div class="flex justify-end gap-3 p-5 border-t border-slate-700">
      <button onclick="fecharModal()" class="btn-ghost">
        <i class="fa-solid fa-xmark mr-1"></i> Cancelar
      </button>
      <button id="modal-btn-salvar" class="btn-primary">
        <i class="fa-solid fa-floppy-disk mr-1"></i> Guardar
      </button>
    </div>
  </div>
</div>

<!-- ════════════ MODAL PARTICIPAÇÕES ════════════ -->
<div id="modal-participacoes" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">
    <div class="flex items-center justify-between p-5 border-b border-slate-700">
      <h3 class="font-bold text-lg"><i class="fa-solid fa-users mr-2 text-indigo-400"></i>Gerir Participações</h3>
      <button onclick="fecharModalParticipacoes()" class="text-slate-400 hover:text-white w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-700 transition-colors">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>
    <div class="p-5">
      <div class="flex gap-2 mb-4">
        <input id="input-nc-inscricao" type="text" placeholder="Nº Cartão do leitor" class="input-dark flex-1"/>
        <button onclick="inscreverLeitorEvento()" class="btn-primary">
          <i class="fa-solid fa-user-plus mr-1"></i> Inscrever
        </button>
      </div>
      <div id="lista-participacoes" class="space-y-2 text-sm"></div>
    </div>
  </div>
</div>

<!-- ════════════ MODAL DEVOLUÇÃO ════════════ -->
<div id="modal-devolucao" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md shadow-2xl">
    <div class="flex items-center justify-between p-5 border-b border-slate-700">
      <h3 class="font-bold text-lg"><i class="fa-solid fa-rotate-left mr-2 text-indigo-400"></i>Registar Devolução</h3>
      <button onclick="fecharModalDevolucao()" class="text-slate-400 hover:text-white w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-700 transition-colors">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>
    <div class="p-5 space-y-4">
      <p id="dev-info" class="text-sm text-slate-300"></p>
      <div>
        <label class="label-dark">Condição na devolução</label>
        <select id="dev-condicao" class="input-dark w-full">
          <option value="BOM">Bom estado</option>
          <option value="DEGRADADO">Degradado</option>
          <option value="PERDIDO">Perdido</option>
        </select>
      </div>
      <div id="dev-multa-info" class="bg-amber-900/30 border border-amber-600 rounded-lg p-3 text-sm text-amber-300 hidden flex items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="dev-multa-msg"></span>
      </div>
    </div>
    <div class="flex justify-end gap-3 p-5 border-t border-slate-700">
      <button onclick="fecharModalDevolucao()" class="btn-ghost">
        <i class="fa-solid fa-xmark mr-1"></i> Cancelar
      </button>
      <button onclick="confirmarDevolucao()" class="btn-primary">
        <i class="fa-solid fa-rotate-left mr-1"></i> Confirmar Devolução
      </button>
    </div>
  </div>
</div>

<!-- Modal Confirmação -->
<div id="modal-confirm" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4">
  <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-sm shadow-2xl">
    <div class="p-5">
      <p id="modal-confirm-msg" class="text-sm text-slate-200"></p>
    </div>
    <div class="flex justify-end gap-3 p-4 border-t border-slate-700">
      <button id="modal-confirm-cancelar" class="btn-ghost">Cancelar</button>
      <button id="modal-confirm-ok" class="btn-danger">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal Reemissão -->
<div id="modal-reemissao" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4">
  <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-sm shadow-2xl">
    <div class="flex items-center justify-between p-5 border-b border-slate-700">
      <h3 class="font-bold text-base">Reemitir Certificado</h3>
      <button id="modal-reemissao-fechar" class="text-slate-400 hover:text-white w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-700 transition-colors">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>
    <div class="p-5">
      <label class="label-dark">Motivo da reemissão *</label>
      <input id="modal-reemissao-motivo" type="text" placeholder="Ex: Certificado perdido" class="input-dark w-full mt-1"/>
    </div>
    <div class="flex justify-end gap-3 p-4 border-t border-slate-700">
      <button id="modal-reemissao-cancelar" class="btn-ghost">Cancelar</button>
      <button id="modal-reemissao-ok" class="btn-primary"><i class="fa-solid fa-rotate mr-1"></i>Reemitir</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl text-sm font-medium shadow-2xl flex items-center gap-2"></div>
