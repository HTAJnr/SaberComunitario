<!DOCTYPE html>
<html lang="pt" class="theme-sul">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saber Comunitário — Gestão de Bibliotecas Comunitárias</title>
  <link rel="icon" type="image/svg+xml" href="/resources/imgs/favicon.svg"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <script>tailwind.config = { darkMode: 'class' };</script>
</head>
<body>

<!-- login injectado via main.js → sections/login.html -->

<!-- ═══════════════════════════ APP ═══════════════════════════ -->
<div id="app" class="hidden">

  <!-- Sidebar -->
  <aside class="sidebar">

    <!-- Cabeçalho: logo + nome da app -->
    <div class="sidebar-header">
      <img src="/resources/imgs/Logo.png" alt="Logo" class="sidebar-logo"/>
      <div>
        <div class="sidebar-app-name">Saber Comunitário</div>
        <div class="sidebar-app-sub">Fundo Bibliográfico</div>
      </div>
    </div>

    <!-- Região + biblioteca -->
    <div class="sidebar-library">
      <div id="sidebar-region-label" class="nav-section-label" style="padding:6px 0 2px"></div>
      <div id="sidebar-library-name" class="sidebar-library-name"></div>
    </div>

    <!-- Navegação -->
    <nav class="sidebar-nav">

      <span class="nav-section-label">Principal</span>
      <a class="nav-item" data-section="dashboard">
        <i class="fa-solid fa-chart-bar" style="width:14px;text-align:center"></i>
        Dashboard
      </a>
      <a class="nav-item" data-section="leitores">
        <i class="fa-solid fa-users" style="width:14px;text-align:center"></i>
        Leitores
      </a>
      <a class="nav-item" data-section="emprestimos">
        <i class="fa-solid fa-arrow-right-arrow-left" style="width:14px;text-align:center"></i>
        Empréstimos
      </a>
      <a class="nav-item" data-section="materiais">
        <i class="fa-solid fa-book" style="width:14px;text-align:center"></i>
        Materiais
      </a>

      <span class="nav-section-label">Operações</span>
      <a class="nav-item" data-section="transferencias">
        <i class="fa-solid fa-right-left" style="width:14px;text-align:center"></i>
        Transferências
      </a>
      <a class="nav-item" data-section="eventos">
        <i class="fa-solid fa-calendar-days" style="width:14px;text-align:center"></i>
        Eventos
      </a>
      <a class="nav-item" data-section="doacoes">
        <i class="fa-solid fa-hand-holding-heart" style="width:14px;text-align:center"></i>
        Doações
      </a>
      <a class="nav-item" data-section="programas">
        <i class="fa-solid fa-graduation-cap" style="width:14px;text-align:center"></i>
        Programas
      </a>

      <span class="nav-section-label">Gestão</span>
      <a class="nav-item" data-section="funcionarios">
        <i class="fa-solid fa-user-tie" style="width:14px;text-align:center"></i>
        Funcionários
      </a>
      <a class="nav-item" data-section="permissoes">
        <i class="fa-solid fa-shield-halved" style="width:14px;text-align:center"></i>
        Permissões
      </a>

    </nav>

    <!-- Rodapé: avatar + utilizador + logout -->
    <div class="sidebar-footer">
      <div id="sidebar-avatar" class="avatar-initials"></div>
      <div class="sidebar-user-info">
        <div id="sidebar-user-name" class="sidebar-user-name"></div>
        <div id="sidebar-user-role" class="sidebar-user-role"></div>
      </div>
      <button id="btn-logout" class="btn-logout" title="Terminar sessão">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>

  </aside>

  <!-- Main: topbar + conteúdo -->
  <div class="main-wrapper">

    <header class="topbar">
      <div class="topbar-left">
        <div id="topbar-title" class="topbar-title"></div>
        <div id="topbar-sub" class="topbar-sub"></div>
      </div>
      <div class="topbar-right">
        <span id="topbar-region-pill" class="region-pill"></span>
      </div>
    </header>

    <main id="main-content" class="content-area"></main>

  </div>

</div>

<script src="js/componentes.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/leitores.js"></script>
<script src="js/materiais.js"></script>
<script src="js/emprestimos.js"></script>
<script src="js/funcionarios.js"></script>
<script src="js/eventos.js"></script>
<script src="js/doacoes.js"></script>
<script src="js/transferencias.js"></script>
<script src="js/programas.js"></script>
<script src="js/permissoes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
